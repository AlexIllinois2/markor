##############################################################################################################################
# Release: build a debug-signed release APK and attach it to a GitHub Release
# Triggered by pushing a tag starting with "v" (e.g. v1.2.3)
##############################################################################################################################

name: "Release Build"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: "Checkout: Code"
      uses: actions/checkout@v5
      with:
        # root build.gradle reads git hash / last commit message at configuration time
        fetch-depth: 0

    - name: "Setup: Java"
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: "temurin"

    - name: "Setup: Gradle"
      uses: gradle/actions/setup-gradle@v5

    - name: "Setup: Debug Signing"
      # .github/keystore/debug.keystore.b64 是标准 Android debug key（口令 android、别名 androiddebugkey），非机密；
      # 生成 keystore.properties 后 app/build.gradle 的 release signingConfig 生效，产物直接是 debug 签名
      run: |
        base64 -d .github/keystore/debug.keystore.b64 > "$RUNNER_TEMP/debug.keystore"
        printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
          "$RUNNER_TEMP/debug.keystore" > keystore.properties

    - name: "Build: Release Apk"
      # flavorDefault = 正式应用变体（flavorAtest 是测试变体，applicationId 带 _test 后缀）
      run: |
        chmod +x gradlew
        ./gradlew assembleFlavorDefaultRelease -x lint --build-cache --parallel --stacktrace

    - name: "Organize: the Files"
      run: |
        mkdir -p apk
        find app/build/outputs/apk -type f -name '*.apk' -exec cp -f {} apk/ \;

    - name: "Verify: APK Signing"
      run: |
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        for f in apk/*.apk; do "$APKSIGNER" verify --print-certs "$f"; done

    - name: "Artifacts: Android APK"
      uses: actions/upload-artifact@v4
      with:
        name: "apk"
        path: apk/*.apk

    - name: "Release: Publish"
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
