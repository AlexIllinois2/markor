name: "CI"

on: [push, pull_request]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci skip') && (!contains(github.event_name, 'pull_request') || (contains(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: ubuntu-latest
    steps:

    - name: "Checkout: Code"
      uses: actions/checkout@v4

    - name: "Checkout: Code (PR)"
      uses: actions/checkout@v4
      if: "contains(github.event_name, 'pull_request')"
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}

    - name: "Setup: Java"
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: "temurin"

    - name: "Setup: Install additional dependencies"
      run: sudo apt-get install -y ispell

    - name: "Cache: Gradle"
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle
          .gradle
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.*') }}

    - name: "Setup: Gradle Wrapper (retry on transient download failure)"
      # services.gradle.org 会 302 到 github.com/gradle/gradle-distributions，
      # 偶发 504 会让 ./gradlew 在下载分发包这一步直接失败；先预热并重试几次
      shell: bash
      run: |
        chmod +x gradlew
        for attempt in 1 2 3 4 5; do
          if ./gradlew --version > /dev/null 2>&1; then
            echo "Gradle wrapper ready (attempt $attempt)"
            exit 0
          fi
          delay=$((attempt * 10))
          echo "::warning::Gradle wrapper bootstrap failed on attempt $attempt, retrying in ${delay}s"
          sleep "$delay"
        done
        echo "::error::Gradle wrapper bootstrap failed after 5 attempts"
        exit 1

    - name: "Build: Project with make"
      run: make clean all

    - name: "Build: List dist files"
      if: always()
      run: find dist -type f -maxdepth 2

    - name: "Artifacts: All"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: "all"
        path: dist
        retention-days: 5

    - name: "Artifacts: Android APK"
      uses: actions/upload-artifact@v4
      with:
        name: "android-apk"
        path: |
          dist/*.apk
